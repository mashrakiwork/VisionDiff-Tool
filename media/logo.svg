<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VisionDiff">
  <!-- One lens, two readings: the left half resolved, the right half still open.
       Deliberately legible at 16px — a favicon that turns to mud in the tab strip
       is not a logo. -->
  <rect width="32" height="32" rx="7" fill="#141821" />
  <path d="M16 7.2A8.8 8.8 0 0 0 16 24.8Z" fill="#5b9cff" transform="translate(-1.3 0)" />
  <path
    d="M16 7.2A8.8 8.8 0 0 1 16 24.8"
    fill="none"
    stroke="#7c869c"
    stroke-width="2.6"
    stroke-linecap="round"
    transform="translate(1.3 0)"
  />
</svg>
